# kamisama-open-api — deploy ke shared host rumah via runner kamisama-v0.
# Secrets (repo Settings → Secrets → Actions), cukup SATU (pola kantor):
#   ENV_FILE — seluruh isi .env production (copy-paste dari .env lokal yang jalan)
name: deploy
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, kamisama]
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env dari secrets (pola kantor — 1 file-secret, .env tak pernah di Git)
        run: |
          test -n "${{ secrets.ENV_FILE }}"
          printf "%s" "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

      - name: Build image lokal (tanpa registry)
        run: |
          docker build \
            -t kamisama/kamisama-open-api:${{ github.sha }} \
            -t kamisama/kamisama-open-api:latest .

      - name: Blue-green deploy (0 downtime via nginx flip)
        # start.sh di image sudah prisma migrate deploy dulu (pola kantor, inline).
        run: ~/bin/kamisama-deploy.sh kamisama-open-api 5002 kamisama/kamisama-open-api:${{ github.sha }}
